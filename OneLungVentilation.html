//	MAIN INTERVAL LOOP
//============================

setInterval(function() {

//		interval=0.2;

			updateExpiredFlows(60);

//	VENTILATION MODES in REAL-TIME INTERVALS
//=================================================

function machineVentilation(t) {
	switch (phaseMachine) {
		case "init":
			tResp=60/fMachine;
			if (SIMV) {
				dResp=waitTimeSIMV/fMachine;
				if (dResp > tResp/2) dResp=tResp/2;
				if (tResp-dResp < 2 ) dResp=tResp-2;
				if (dResp > waitTimeSIMV ) dResp=waitTimeSIMV;
				waitTimeSIMV-=dResp;
				tResp-=dResp;
			}
			tExp=tResp/(1+ieRatio);
			tInsp=tResp-tExp;
			flowSpeed=tidalV/(tInsp*0.7);
			timerMachine=0;
			if (SIMV) phaseMachine="SIMV";
			else chooseInspirationMode();
		break;
		case "SIMV":
			if( phaseSpont == 0 || phaseSpont == 4 || waitTimeSIMV > 60/fMachine*2 )
				chooseInspirationMode();
			else waitTimeSIMV+=t;
		break;
		case "inspirationVCV":
			if (getInflowPerTime(timerMachine) < tidalV) {
				dP=flowSpeed/airwayR;
//				if (dP > pRaiseSpeed*t) dP=pRaiseSpeed*t;
				pMachine=lungPressure+dP;
				if (pMachine>pMaxMachine) {
					console.log("pressure limit! "+pMachine+" kPa");
					pMachine=pMaxMachine;
					overP=true;
					}
			} else pMachine=lungPressure;
			if( timerMachine > tInsp) {
				phaseMachine="expiration";
				if (getInflowPerTime(timerMachine) < tidalV) {
					console.log("Volume not reached! "+TVinsp);
					}
				pMachine=PEEP;
				timerMachine=0;
			} else timerMachine+=t;			
		break;
		case "inspirationPCV":
			if (pMachine < PEEP+PIP) {
				pMachine+=pRaiseSpeed*t;
				if (pMachine > PEEP+PIP) pMachine=PEEP+PIP;
				if (pMachine > pMaxMachine) { pMachine=pMaxMachine; overP=true;}
				}
			if (timerMachine > tInsp) {
				phaseMachine="expiration";
				if (VG) {
					if (TVinsp > tidalV*1.1 && PIP>3) PIP--;
					if (TVinsp < tidalV*0.9 && PIP+1 < pMaxMachine) PIP++;
					document.getElementById("PIP").value=PIP;
					document.getElementById("PIPBox").innerHTML=
						'<div style="font-size:1vw;">PIP</div>'+PIP+
						'<div style="font-size:0.8vw;">cmH2O</div>';
				}
				pMachine=PEEP;
				timerMachine=0;
			} else timerMachine+=t;
		break;
		case "expiration":
			if (pMachine > PEEP) pMachine-=pRaiseSpeed*t;
			if (pMachine <  PEEP) pMachine=PEEP;
			if ( timerMachine > tExp) {
				phaseMachine="init";
				timerMachine=0;
				}
			else timerMachine+=t;
		break;
		case "wait":
			if (timerMachine>60/fMachine)
				phaseMachine="init";
			else timerMachine+=t;
		break;
		default: phaseMachine="init";
		break;
	}

	function chooseInspirationMode() {
		VG=false;
		switch (ventilationMode) {
			case "VCV":
				phaseMachine="inspirationVCV";message+="VCV";
			break;
			case "PCV":
				phaseMachine="inspirationPCV";message+="PCV";
			break;
			case "PCV-VG":
				phaseMachine="inspirationPCV";message+="PCV";VG=true;
			break;
			default:phaseMachine="init";break;
		}
	}
}

tInspSpont=1;tExpSpont=2;
spontInspSpeed=5;
cspontExpSpeed=5;
function spontaneousVentilation(t) {
	switch (phaseSpont) {
		case 0:
			adaptSpontaneousVentilation();
			tExpSpont=60/fSpont/(1+ieSpont);
			tInspSpont=60/fSpont-tExpSpont;
			spontInspSpeed=spontTidal/(tInspSpont*0.5);
			spontExpSpeed=spontTidal/(tExpSpont*0.5);
			phaseSpont=1;
			timerSpont=0;
			message=message+"Spont";
		break;
		case 1:
			timerSpont+=t;
			if (FRC < spontZeroV+spontTidal
				&& timerSpont < tInspSpont)
					FRC+=spontInspSpeed*t;
			else phaseSpont=2;
		break;
		case 2:
			timerSpont+=t;
			if (timerSpont>tInspSpont) {
				phaseSpont=3;
				timerSpont=0;
				}
		break;
		case 3:
			timerSpont+=t;
			if (FRC > spontZeroV && timerSpont < tExpSpont)
				FRC-=spontExpSpeed*t;
			else phaseSpont=4;
		break;
		case 4:
			timerSpont+=t;
			if (timerSpont>tExpSpont) {
				phaseSpont=0;
				timerSpont=0;
				}
		break;
		default:break;
	}


	function adaptSpontaneousVentilation() {
		if ( ( !isCOPD && carbonDioxidePressureFromConcentration(arteriaCO2) ) > 6 
			|| oxygenPressureFromConcentration(arteriaO2)<6 )
				{
				if (fSpont < 30)
					fSpont+=0.5;
				if (spontTidal<1000)
					spontTidal=spontTidal*1.1;
				}
		else if ( carbonDioxidePressureFromConcentration(arteriaCO2) < 5 
			|| (isCOPD && oxygenPressureFromConcentration(arteriaO2)>7 ) )
				{
				if (fSpont > 3)
					fSpont--;
				if (spontTidal>100)
					spontTidal=spontTidal*0.9;
				}
	}
}

function pressureSupportVentilation(t) {
	switch(phasePSV) {
		case 0:
			if (pMachine<=PEEP && dFlow > (triggerFlow*1000/60) && dFlow > lastFlow)
				{
				phasePSV=1;
				message=message+"PSV";
				pMachine=PEEP+pPSV;
				phaseMachine="wait";
				timerMachine=0;
				}
		break;
		case 1:
			if (dFlow < (triggerFlow*1000/60) && dFlow < lastFlow)
				{
				phasePSV=2;
				pMachine=PEEP;
				}
		break;
		case 2:
			if ( dFlow <= 0 ) {
				phasePSV=0;
				phaseMachine="init";
				}
		break;
		default:break;
	}

}

	cardiacOutput=5;

	switch( patient.options[patient.selectedIndex].text) {
		case "Astma":
			airwayR=10;
		break;
		case "COPD":
			lungK=100;
			diffusionCoefficient=0.005;
			shuntProcent=0.1;
			setDeadSpaceProcent(0.7);
			lungBloodV=35;
			airwayR=30;
			isCOPD=true;
		break;
		case "Fibrosis":
			lungBloodV=50;
			lungK=15;
			setDeadSpaceProcent(0.45);
			shuntProcent=0.1;
			diffusionCoefficient=0.002;
			isCOPD=true;
		break;
		case "Lung embolia":
			lungBloodV=10;
			setDeadSpaceProcent(0.9);
		break;
		case "ARDS":
			lungBloodV=45;
			lungK=20;
			airwayR=45;
			shuntProcent=0.5;
			setDeadSpaceProcent(0.7);
			diffusionCoefficient=0.003;
		break;
		case "Hypermetabolism":
			VO2=20;
			cardiacOutput=25;
		break;
		default:	//"Normal"
		break;
	}

	if (oneLung) {
		lungBloodV=lungBloodV*0.5;
		lungK=lungK*2;
		shuntProcent=(1-shuntProcent)*0.2+shuntProcent;
		RV=RV*0.5;
		FRC=FRC*0.5;
		}

	setParameters();
	patient.blur();
}

function setDeadSpaceProcent(procent){
	if (procent<0) procent=0;
	if (procent>1) procent=1;
	deadSpaceProcent=procent;
	O2=(lungO2ml+deadSpaceO2ml);
	CO2=(lungCO2ml+deadSpaceCO2ml);
	NO2=(lungNO2ml+deadSpaceNO2ml);
	lungO2ml=O2*(1-procent);
	lungCO2ml=CO2*(1-procent);
	lungNO2ml=NO2*(1-procent);
	deadSpaceO2ml=O2*procent;
	deadSpaceCO2ml=CO2*procent;
	deadSpaceNO2ml=NO2*procent;
}

function initializePressureScreen() {
	if (pMax<1) pMax=1;
	pressure.clearRect(0,0,pressureScreen.width,pressureScreen.height);
	pressure.font="30px sans-serif";
	pressure.strokeStyle="#01AA09";
	pressure.fillStyle="#01AA09";
	max=pMax; if (max>9) max=Math.ceil(max/10)*10;

	pressure.fillText(max.toFixed(0)+" cmH2O",10,30);
	pressure.fillText("Pressure",pressureScreen.width/2-100,30);
	
	pScale=pressureScreen.height/(pMax-pMin)*0.8;
	if (pScale<1) pScale=1;
	pZero=pressureScreen.height+pMin*pScale-20;
	xPS=0,yPS=0;

	pressure.beginPath();
	pressure.moveTo(0,pZero);
	pressure.lineTo(pressureScreen.width-270,pZero);
	pressure.stroke();
//	pressure.fillText("0",10,pZero-10);
	pMax=0;pMin=0;pTime=0;pCurrent=0;
	updatePeak();
}

xPS=0,yPS=0;
function updatePressureScreen(t) {
	pTime+=t;
	if (pTime*timeScale>pressureScreen.width-250) 
		initializePressureScreen();
	else
		{
		pressure.strokeStyle="#00AAAA";
		pressure.beginPath();
		pressure.moveTo(xPS,yPS);
		if (showMessages && message!="") {
			pressure.lineTo(xPS-30,yPS-10);
			pressure.fillStyle="#00AAAA";
			pressure.font="12px sans-serif";
			pressure.fillText(message,xPS-20-message.length*8,yPS-10);
			pressure.moveTo(xPS,yPS);
		}
		pCurrent=getAirwayPressure();
		if (pCurrent > pPeak) pPeak=pCurrent;
		if (pCurrent < autoPEEP) autoPEEP=pCurrent;
		xPS=pTime*timeScale;
		yPS=pZero-pCurrent*pScale;
		pressure.lineTo(xPS,yPS);
		pressure.stroke();
		if (pCurrent > pMax) pMax=pCurrent;
		if (pCurrent < pMin) pMin=pCurrent;
		}
}

function drawDiagramLine(x0,y,name,value,isHalf,isPilar) {

	else l=fgfLine;
	freshGas.beginPath();
	freshGas.font="20px sans-serif";
	y0=fgfScreen.height-10-y;
	if (y0<120) y0=120;
	freshGas.clearRect(x0,y0-30,l*2,30);
	freshGas.moveTo(x0,y0);
	freshGas.lineTo(x0+l,y0);
	freshGas.lineTo(x0+l+10,y0-10);
	if (isPilar) {
		freshGas.moveTo(x0,y0);
		freshGas.lineTo(x0,fgfScreen.height-10);
		freshGas.moveTo(x0+l,y0);
		freshGas.lineTo(x0+l,fgfScreen.height-10);
		freshGas.moveTo(x0+l+10,y0-10);
		freshGas.lineTo(x0+l+10,fgfScreen.height-20);
	}
	freshGas.fillText(name,x0+l+10,y0-10);
	if (isHalf) freshGas.fillText(value,x0+5,y0-10);
	else freshGas.fillText(value,x0+10,y0-10);
	freshGas.stroke();
}

spiroVZero=1500;spiroPZero=0;
spiroVScale=spirometryScreen.width/(spiroVMax-spiroVMin);
spiroPScale=spirometryScreen.height/(spiroPMax-spiroPMin);
spiroOldV=0;spiroOldP=0;
initiateSpirometryScreen()

function initiateSpirometryScreen() {
	spirometry.clearRect(0,0,spirometryScreen.width,spirometryScreen.height);

	if (spiroPMin>0 )spiroPMin=spiroPMin*0.9;
	else spiroPMin=spiroPMin*1.1;
	if (spiroVMin>0 )spiroVMin=spiroVMin*0.9;
	else spiroVMin=spiroVMin*1.1;

	dSpiroV=spiroVMax-spiroVMin;
	dSpiroP=spiroPMax-spiroPMin;
	if (dSpiroV>0)
		spiroVScale=spirometryScreen.height/(spiroVMax-spiroVMin)*0.8;
	else spiroVScale=1;
	if (dSpiroP>0)
		spiroPScale=spirometryScreen.width/(spiroPMax-spiroPMin)*0.8;
	else spiroPScale=1;
	spiroVZero=spiroVMin;spiroPZero=spiroPMin;
	spirometry.font="20px sans-sarif";
	spirometry.fillStyle="#01AA09";
	spirometry.strokeStyle="#00AAAA";
	spirometry.fillText(Math.floor(spiroPZero/10)*10,40,spirometryScreen.height-10);
	spirometry.fillText(Math.ceil(spiroPMax/10)*10,spirometryScreen.width-50,spirometryScreen.height-10);
	spirometry.fillText("pressure",spirometryScreen.width/2,spirometryScreen.height-10);

	spirometry.save();
	spirometry.translate(0,spirometryScreen.height);
	spirometry.rotate(-Math.PI/2);
	spirometry.fillText(Math.floor(spiroVZero/10)*10,40,20);
	spirometry.fillText(Math.ceil(spiroVMax/10)*10,spirometryScreen.width-50,20);
	spirometry.fillText("volume",spirometryScreen.width/2,20);
	spirometry.restore();

	spiroVMax=totalLungVolume();spiroVMin=spiroVMax;
	spiroPMax=getAirwayPressure();spiroPMin=spiroPMax;
}

function updateSpirometryScreen() {
	spirometry.beginPath();
	spirometry.moveTo(spiroOldP,spiroOldV);
	spiroOldP=lungPressure+pMachine/2;
	spiroOldV=totalLungVolume();
	if (spiroOldP > spiroPMax) spiroPMax=spiroOldP;
	if (spiroOldV > spiroVMax) spiroVMax=spiroOldV;
	if (spiroOldP < spiroPMin) spiroPMin=spiroOldP;
	if (spiroOldV < spiroVMin) spiroVMin=spiroOldV;

	spiroOldP=(spiroOldP-spiroPZero)*spiroPScale;
	spiroOldV=spirometryScreen.height-(spiroOldV-spiroVZero)*spiroVScale;

	spirometry.lineTo(spiroOldP,spiroOldV);
	spirometry.stroke();
}


// 	PHYSIOLOGICAL MODELS
//===================================================

function updatePhysiologicalModels(t) {

// fresh gas flow

	machineO2ml+=oxygenFGF*1000/60*t+0.21*airFGF*1000/60*t;
	machineNO2ml+=0.79*1000/60*airFGF*t;

	if (machineVolume() > machineMax) {
		scavenger=machineVolume()-machineMax;
		machineO2ml-=scavenger*FiO2();
		machineNO2ml-=scavenger*(1-FiO2());
		}

// gas exchange

	dPO2=etO2()*100-oxygenPressureFromConcentration(lungBloodO2);
	dO2=lungBloodV*dPO2*diffusionCoefficient*t;

	if (dPO2>0) {
		dO2max=(dPO2/100)*activeLungVolume();
		if (dO2max>lungO2ml) dO2max=lungO2ml;
		dO2max2=(oxygenConcentrationFromSaturation(0.999)-lungBloodO2)*lungBloodV;
		if (dO2max2 > 0 && dO2max > dO2max2) dO2max=dO2max2;
		if (dO2>dO2max) dO2=dO2max;
	} else {		
		dO2max=-(lungBloodO2-oxygenConcentrationFromPressure(etO2()*100))*lungBloodV;
		if (dO2max>lungBloodO2*lungBloodV) dO2max=lungBloodO2*lungBloodV;
		if (dO2 < dO2max) dO2=dO2max;
	}

	lungBloodO2=(lungBloodO2*lungBloodV+dO2)/lungBloodV;
	lungO2ml-=dO2;

	dPCO2=carbonDioxidePressureFromConcentration(lungBloodCO2)-etCO2()*100;
	dCO2=lungBloodV*dPCO2*diffusionCoefficient*20*t;

	if (dPCO2>0) {
		dCO2max=(lungBloodCO2-carbonDioxideConcentrationFromPressure(etCO2()*100))*lungBloodV;
		if (dCO2max>lungBloodCO2*lungBloodV) dCO2max=lungBloodCO2*lungBloodV;
		if (dCO2>dCO2max) dCO2=dCO2max;
	} else {
		dCO2max=(dPCO2/100)*activeLungVolume();
		if (dCO2max>lungCO2ml) dCO2max=lungCO2ml;
		if (dCO2 < dCO2max) dCO2=dCO2max;
	}

	lungBloodCO2=(lungBloodCO2*lungBloodV-dCO2)/lungBloodV;
	lungCO2ml+=dCO2;

// Oxygen consumption VO2

	SvO2=oxygenSaturationFromConcentration(venaO2);
	if (venaO2*venaV>VO2*t && SvO2>0.3) {
		venaO2=(venaO2*venaV-VO2*t)/venaV;
		venaCO2=(venaCO2*venaV+VO2*t)/venaV;
	} else {
		totalLactate+=((VO2*t/22.4)/6)*((0.3-SvO2)/0.3)*16;
		aerobicVO2=VO2*t*(SvO2/0.3);
		if (aerobicVO2>venaO2*venaV) {
			venaCO2=venaO2;
			venaO2=0;
			}
		else {
			venaO2=(venaO2*venaV-aerobicVO2)/venaV;
			venaCO2=(venaCO2*venaV+aerobicVO2)/venaV;
		}
	}

// Lactate metabolism

	totalLactate=totalLactate*Math.pow(0.5,(t/lactateHalfLife));

// Circulation

	flowTotal=cardiacOutput*1000/60*t;
	if (flowTotal>arteriaV) flowTotal=arteriaV;
	if (flowTotal>venaV) flowTotal=venaV;
	flowPulmonary=flowTotal*(1-shuntProcent);
	if (flowPulmonary > lungBloodV) flowPulmonary=lungBloodV;
	flowShunt=flowTotal-flowPulmonary;

	arteriaO2=(arteriaO2*arteriaV+lungBloodO2*flowPulmonary+venaO2*flowShunt-arteriaO2*flowTotal)/arteriaV;
	arteriaCO2=(arteriaCO2*arteriaV+lungBloodCO2*flowPulmonary+venaCO2*flowShunt-arteriaCO2*flowTotal)/arteriaV;

	venaO2=(venaO2*venaV-venaO2*flowPulmonary-venaO2*flowShunt+arteriaO2*flowTotal)/venaV;
	venaCO2=(venaCO2*venaV-venaCO2*flowPulmonary-venaCO2*flowShunt+arteriaCO2*flowTotal)/venaV;

	lungBloodO2=(lungBloodO2*lungBloodV+venaO2*flowPulmonary-lungBloodO2*flowPulmonary)/lungBloodV;
	lungBloodCO2=(lungBloodCO2*lungBloodV+venaCO2*flowPulmonary-lungBloodCO2*flowPulmonary)/lungBloodV;

// updateLungVolume
	monitor.fillText("start updateLungVolume : ",1010,400);

	if (pMachine>pMaxMachine) {
		console.log("Max pressure reached! "+pMachine);
		pMachine=pMaxMachine;
	}

	dFlow=(pMachine-lungPressure)*airwayR;
	dV=dFlow*t;

	if (dV>0) {	
		if (dV> (machineVolume()-machineMin))
			{
			console.log("machine negative pressure! :"+dV+" > "+machineVolume());
			
			dV=(machineVolume()-machineMin);
			}
		inspiration(dV);
	} else {
		dV=-dV;
		if (dV > (totalLungVolume()-RV)) 
			{
			console.log("lungs empty! :"+dV+" > "+totalLungVolume());
			dV=totalLungVolume()-RV;
			}
		expiration(dV);
	}

// updateLungPressure

	if (totalLungVolume() < FRC ) lungPressure=(totalLungVolume()/FRC)*100-100;
	else lungPressure=Math.pow( (totalLungVolume()-FRC) ,lungX) / lungK;
}

function inspiration(ml) {
	if (ml>tubeV*0.5) ml=tubeV*0.5;

	// intubation tube - lungs connection

	dO2=(tubeO2ml/tubeV)*ml;
	dCO2=(tubeCO2ml/tubeV)*ml;
	dNO2=ml-dO2-dCO2;

	tubeO2ml-=dO2;
	tubeCO2ml-=dCO2;

	lungO2ml+=dO2*(1-deadSpaceProcent);
	lungNO2ml+=dNO2*(1-deadSpaceProcent);
	lungCO2ml+=dCO2*(1-deadSpaceProcent);

	deadSpaceO2ml+=dO2*deadSpaceProcent;
	deadSpaceNO2ml+=dNO2*deadSpaceProcent;
	deadSpaceCO2ml+=dCO2*deadSpaceProcent;

	// machine - intubation tube connection

	dO2=ml*FiO2();
	dNO2=ml-dO2;
	
	machineO2ml-=dO2;
	machineNO2ml-=dNO2;
	tubeO2ml+=dO2;

	tInflow.push(realTimer);
	dInflow.push(ml);
}

function expiration(ml) {
	if (ml>tubeV*0.5) ml=tubeV*0.5;

	// intubation tube - machine connection

	dO2=(tubeO2ml/tubeV)*ml;
	dCO2=(tubeCO2ml/tubeV)*ml;
	dNO2=ml-dO2-dCO2;

	tubeO2ml-=dO2;
	tubeCO2ml-=dCO2;

	machineO2ml+=dO2;
	machineNO2ml+=dNO2;

	// lungs - intubation tube connection

	endTidal=ml*(1-currentDeadSpaceProcent());
	deadSpace=ml-endTidal;

	dO2et=endTidal*etO2();
	dNO2et=endTidal*etNO2();
	dCO2et=endTidal*etCO2();
	lungO2ml-=dO2et;
	lungNO2ml-=dNO2et;
	lungCO2ml-=dCO2et;

	dO2ds=deadSpace*deadSpaceO2();
	dCO2ds=deadSpace*deadSpaceCO2();
	dNO2ds=deadSpace*deadSpaceNO2();
	deadSpaceO2ml-=dO2ds;
	deadSpaceCO2ml-=dCO2ds;
	deadSpaceNO2ml-=dNO2ds;

	tubeO2ml+=dO2et+dO2ds;
	tubeCO2ml+=dCO2et+dCO2ds;

	tOutflow.push(realTimer);
	dOutflow.push(ml);
}

//	TRANSFORMATION GET VALUE() -FUNCTIONS
//===============================================
	
function activeLungVolume() {
	return lungNO2ml+lungCO2ml+lungO2ml;
}

function deadSpaceVolume() {
	return deadSpaceNO2ml+deadSpaceCO2ml+deadSpaceO2ml;
}

function totalLungVolume() {
	return activeLungVolume()+deadSpaceVolume();
}

function bloodTotalVolume() {
	return arteriaV+venaV+lungBloodV;
}

function bloodLactate() {
	return totalLactate/bloodTotalVolume()*1000;
}

function etO2() {
	if (activeLungVolume()>0) return lungO2ml/activeLungVolume();
	else return 0;
	}

function etCO2() {
	if (activeLungVolume()>0)
		return lungCO2ml/activeLungVolume();
	else return 0;
	}

function totalLungCO2ml() {
	return (lungCO2ml+deadSpaceCO2ml);
}

function totalLungO2ml() {
	return (lungO2ml+deadSpaceO2ml);
}

function totalLungCO2() {
	if (activeLungVolume()>0)
		return (totalLungCO2ml()/totalLungVolume());
	else return 0;
}

function totalLungO2() {
	if (activeLungVolume()>0)
		return (totalLungO2ml()/totalLungVolume());
	else return 0;
}

function etNO2() {
	if (activeLungVolume()>0)
		return lungNO2ml/activeLungVolume();
	else return 0;
	}

function totalFGF() {
	return oxygenFGF+airFGF;
	}

function freshGasO2() {
	return (oxygenFGF+0.21*airFGF)/totalFGF();
	}

function deadSpaceO2() {
	if (deadSpaceVolume() > 0)
		return deadSpaceO2ml/deadSpaceVolume();
	else return 0;
	}

function deadSpaceNO2() {
	if (deadSpaceVolume() > 0)
		return deadSpaceNO2ml/deadSpaceVolume();
	else return 0;
	}

function deadSpaceCO2() {
	if (deadSpaceVolume() > 0)
		return deadSpaceCO2ml/deadSpaceVolume();
	else return 0;
	}

function currentDeadSpaceProcent() {
	if (totalLungVolume() > 0)
		return deadSpaceVolume()/totalLungVolume();
	else return 0;
}

function machineVolume() {
	return machineO2ml+machineNO2ml;
}

function FiO2() {
	if (machineVolume() > 0)
		return machineO2ml/machineVolume();
	else return 0;
}

function oxygenContent(where) {
	switch (where) {
		case "vena":
			return venaO2*venaV;
		break;
		case "arteria":
			return arteriaO2*arteriaV;
		break;
		case "pulmonary":
			return lungBloodO2*lungBloodV;
		break;
		default: return 0;
		break;
		}
}

function co2Content(where) {
	switch (where) {
		case "vena":
			return venaCO2*venaV;
		break;
		case "arteria":
			return arteriaCO2*arteriaV;
		break;
		case "pulmonary":
			return lungBloodCO2*lungBloodV;
		break;
		default: return 0;
		break;
		}
}

function getAirwayPressure() {
//	return pMachine;
	return pMachine*0.9+lungPressure*0.1;
}

function updateExpiredFlows(s) {
	sinceInflow=realTimer;
	for (i=tInflow.length-1;i>=0;i--)
		if (tInflow[i] < realTimer-s)
			{
			tInflow[i]=tInflow.pop();
			dInflow[i]=dInflow.pop();
			}
		else if (tInflow[i] < sinceInflow)
			sinceInflow=tInflow[i];

	sinceOutflow=realTimer;
	for (i=tOutflow.length-1;i>=0;i--)
		if (tOutflow[i] < realTimer-s)
			{
			tOutflow[i]=tOutflow.pop();
			dOutflow[i]=dOutflow.pop();
			}
		else if (tOutflow[i] < sinceOutflow)
			sinceOutflow=tOutflow[i];

	for (i=tCycle.length-1;i>=0;i--)
		if (tCycle[i] < realTimer-s)
			tCycle[i]=tCycle.pop();
}

function getInflowPerTime(s) {
	totalIn=0;
	for (i=0;i < dInflow.length;i++)
		if (tInflow[i] > realTimer-s)
			totalIn+=dInflow[i];
	return totalIn;
}

function getOutflowPerTime(s) {
	totalOut=0;
	for (i=0;i < dOutflow.length;i++)
		if (tOutflow[i] > realTimer-s)
			totalOut+=dOutflow[i];
	return totalOut;
}

function getFrequencyPerTime(s) {
	RR=0;
	for (i=0;i< tCycle.length;i++)
		if (tCycle[i]>realTimer-s)
			RR++;
	return RR;
	}

// 	EQUATIONS
//===========================================

//by Severinghaus equation
function oxygenSaturationFromPressure(pO2) { 
	pO2=pO2*7.5;
	SpO2= 1/( 1/(Math.pow(pO2,3)+150*pO2)*23400+1 );
	if (SpO2<0) return 0;
	if (SpO2>1) return 1;
	return SpO2;
}

function oxygenSaturationFromConcentration(O2) {
	pO2=oxygenPressureFromConcentration(O2);
	return oxygenSaturationFromPressure(pO2);
}

//by Ellis equation (reverse Severinghaus)
function oxygenPressureFromSaturation(SpO2) { 
	if (SpO2>0.9999)  SpO2=0.9999;
	if (SpO2<0) SpO2=0;
	A=11700*1/(1/SpO2-1);
	B=Math.sqrt(50*50*50+A*A);
	pO2= (Math.pow((B+A),1/3)-Math.pow((B-A),1/3))/7.5;
	return pO2;
}

function oxygenPressureFromConcentration(cO2) {
	SpO2=cO2/(1.34*(Hb/1000));
	return oxygenPressureFromSaturation(SpO2);
	}

function oxygenConcentrationFromPressure(pO2) {
	return 1.34*Hb/1000*oxygenSaturationFromPressure(pO2);
}

function oxygenConcentrationFromSaturation(SpO2) {
	pO=oxygenPressureFromSaturation(SpO2);
	return oxygenConcentrationFromPressure(pO2);
}

function carbonDioxidePressureFromConcentration(CO2) {
	CO2=CO2*100;
	return 0.005*Math.pow(CO2,2.3)/7.5;
}

function carbonDioxideConcentrationFromPressure(pCO2) {
	if (pCO2<0) return 0;
	pCO2=pCO2*7.5;
	return Math.pow(pCO2/0.005,1/2.3)/100;
}
